<body class="locked">

<main class="gate" id="gate">
  <div class="wrap">
    <p class="eyebrow">Alice Zhou &nbsp;·&nbsp; Philadelphia, PA</p>
    <h1 class="gate-h">This one's behind <em>a password.</em></h1>

      <div class="gate-row">

               spellcheck="false" aria-describedby="gate-msg" required>
        <button class="gate-btn" type="submit" id="gate-btn">Enter</button>
      </div>
      <p class="gate-msg" id="gate-msg" role="status" aria-live="polite"></p>
    </form>

    <p class="gate-foot">
      If you have the link you probably have the password too. If not,
      <a href="mailto:azhou1@wharton.upenn.edu">email me</a> and I'll send it over.

      <p class="gate-foot">This page needs JavaScript to decrypt its contents. Please enable it, or email me and I'll send you a PDF instead.</p>

  </div>
